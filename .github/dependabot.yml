# Dependabot configuration — security updates only.
#
# Routine version-update PRs are disabled (open-pull-requests-limit: 0). Dependabot
# only opens PRs for dependencies with a known security advisory, and those security
# fixes are grouped so multiple fixes in one ecosystem arrive as a single PR.
#
# Note: the limit of 0 disables version updates but does NOT affect security updates
# (they have a separate internal limit). Security-update PRs also require "Dependabot
# security updates" to be enabled in Settings -> Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
