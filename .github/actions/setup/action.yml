name: Set up pnpm workspace
description: >-
  pnpm, the Node version in .nvmrc with the pnpm store cached, and a frozen-lockfile install of
  the workspace. Every CI job that needs node_modules starts here, after actions/checkout.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
