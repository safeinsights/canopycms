name: Publish to npm

on:
  push:
    branches: [main]
  # Manual runs publish a PRERELEASE from the selected branch, never a stable
  # release. Pick a non-main branch in the Actions UI. This trigger lives here
  # rather than on publish-prerelease.yml because npm allows one trusted
  # publisher per package, bound to a workflow filename, and validates the
  # *calling* workflow for `workflow_call` — so every publish must enter
  # through this file. See publish-prerelease.yml for the full explanation.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # NEVER cancel a publish, on either channel. Queue instead.
  #
  # A run killed part-way through the five publishes moves the dist-tag for
  # some packages and not others, leaving adopters on a mismatched set -- and
  # peer dependencies between these packages are EXACT pins, so a mismatch is
  # an install-time ERESOLVE, not a subtle incompatibility.
  #
  # On the stable channel it is worse than a mismatched set. The version-bump
  # commit lands only AFTER all five publishes, so a cancellation leaves npm
  # holding a version main does not know about; every later run then re-derives
  # that same version and dies on "cannot publish over previously published
  # version", wedging the release train until a human intervenes. (The bump is
  # now registry-floored as well, so that specific wedge self-heals -- but not
  # cancelling is what stops it happening in the first place.)
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      # List this commit's CI workflow runs, for the gate below. That is the
      # `actions` scope, not `checks` -- workflow runs and check runs are
      # different APIs, and `checks: read` would not authorize it.
      actions: read

    steps:
      # THE CI GATE.
      #
      # This step replaces a comment that claimed "Only run after CI passes"
      # while no such mechanism existed: CI and publish are separate workflows
      # that both trigger on push to main and run CONCURRENTLY, and the repo's
      # rulesets require a PR review but NOT any status check -- verified
      # against live config -- so a red or still-running commit could merge and
      # publish. `npm publish` then shipped it to `latest` with provenance,
      # and publish.yml runs `build` only, never the test suite.
      #
      # The failure this actually guards is merge skew: two PRs that each pass
      # CI alone can combine into a red main, and no PR ever tested that
      # combination. Branch protection cannot catch it; only a check on the
      # merge commit can.
      #
      # Deliberately an in-job wait rather than a `workflow_run` trigger. npm
      # trusted publishing is bound to this workflow FILENAME and validates the
      # calling workflow, and `workflow_run` additionally changes the checkout
      # context (it defaults to the default branch rather than the triggering
      # SHA -- an easy way to publish the wrong commit). This touches neither.
      #
      # Prereleases are unaffected: they run through the `prerelease` job on
      # `workflow_dispatch`, which never reaches this job.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # CI can take a few minutes; fail loudly rather than hang forever if
          # it never reports at all (e.g. a cancelled run, or a paths filter
          # that skipped every job).
          TIMEOUT_SECONDS: '1800'
        run: |
          set -euo pipefail
          echo "Waiting for the CI workflow to conclude on $SHA"
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          while :; do
            # The CI workflow's own run for this exact commit.
            conclusion=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0].conclusion // empty' || true)
            status=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0].status // empty' || true)

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI succeeded on $SHA - publishing."
                break
              fi
              echo "::error::CI concluded '$conclusion' on $SHA. Refusing to publish."
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for CI on $SHA (last status: '${status:-none}'). Refusing to publish."
              exit 1
            fi
            sleep 15
          done

      # Mint a short-lived token for the dedicated release app. Its bypass of the
      # "changes must go through a PR" rule is gated by RELEASE_BOT_PRIVATE_KEY,
      # which only exists in this repo — unlike the generic GITHUB_TOKEN, which
      # cannot be granted bypass at all.
      - name: Generate release-bot app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API clients
        run: pnpm run generate:client
        working-directory: packages/canopycms

      # Floored on the REGISTRY, not just the committed version. The bump
      # commit lands only after all five publishes, so an interrupted run
      # leaves npm ahead of main -- after which bumping from the committed
      # value re-derives an already-published version and every subsequent run
      # dies on "cannot publish over previously published version", forever.
      # Taking max(committed, registry) makes that state self-healing.
      #
      # `|| true` plus the empty check: a brand-new package that has never been
      # published has no registry version, which is not an error.
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          PUBLISHED=$(npm view canopycms version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "Registry has canopycms@$PUBLISHED"
            NEW_VERSION=$(node scripts/bump-version.mjs --min "$PUBLISHED")
          else
            echo "No published canopycms version found; bumping from the repo"
            NEW_VERSION=$(node scripts/bump-version.mjs)
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Build publishable packages
        run: |
          pnpm --filter canopycms run build
          pnpm --filter canopycms-next run build
          pnpm --filter canopycms-auth-clerk run build
          pnpm --filter canopycms-auth-dev run build
          pnpm --filter canopycms-cdk run build
          pnpm --filter canopycms-cdk run build:worker
          pnpm --filter canopycms-cdk run build:lambda

      # pnpm pack resolves workspace: protocol refs to real versions.
      #
      # `npm publish` (for OIDC trusted publishing auth + provenance) runs via
      # `pnpm dlx npm@11.19.0` rather than a plain `npm` on PATH. Two reasons:
      #
      #   1. Integrity. This job holds `id-token: write` and its artifacts
      #      carry a provenance signature that downstream consumers trust.
      #      pnpm always verifies a fetched package's tarball against the
      #      registry-advertised sha512 (throwing ERR_PNPM_TARBALL_INTEGRITY
      #      on mismatch) before it ever touches disk, so a tampered/MITMed
      #      npm package fails the job instead of silently running and then
      #      signing its own output. A bare `curl | tar` bootstrap has no such
      #      check.
      #   2. Exact pin. `npm@11.19.0` here is the literal version dlx
      #      resolves and runs -- no separate "install -g npm@11" step that
      #      re-resolves a floating major after the fact.
      #
      # This also sidesteps Node's bundled npm entirely, which as of this
      # writing has a broken module tree on the pinned Node version (missing
      # promise-retry -- a known npm self-install/packaging defect, see
      # npm/cli#9526) that would break a plain `npm publish`. It is not a
      # provenance-support version requirement -- provenance has worked since
      # npm 9.5, well below what Node 22 bundles.
      #
      # There IS a version floor, and it is a different one: OIDC trusted
      # publishing requires npm >= 11.5.0. This is worth spelling out because
      # getting it wrong is silent until release day -- an earlier revision of
      # this file pinned 11.4.1 on the reasoning above, which is about
      # provenance and does not constrain the auth mechanism at all. That pin
      # would have failed all five publishes on the next push to main. The
      # previous `install -g npm@11` floated past the floor by accident, which
      # is why v0.0.57-61 published successfully.
      #
      # 11.19.0 is what `npm@11` resolves to today, i.e. exactly what those
      # working releases used -- now pinned rather than floated. When bumping,
      # stay >= 11.5.0.
      - name: Publish canopycms
        run: |
          pnpm pack
          pnpm dlx npm@11.19.0 publish canopycms-*.tgz --access public --provenance
        working-directory: packages/canopycms

      - name: Publish canopycms-next
        run: |
          pnpm pack
          pnpm dlx npm@11.19.0 publish canopycms-next-*.tgz --access public --provenance
        working-directory: packages/canopycms-next

      - name: Publish canopycms-auth-clerk
        run: |
          pnpm pack
          pnpm dlx npm@11.19.0 publish canopycms-auth-clerk-*.tgz --access public --provenance
        working-directory: packages/canopycms-auth-clerk

      - name: Publish canopycms-auth-dev
        run: |
          pnpm pack
          pnpm dlx npm@11.19.0 publish canopycms-auth-dev-*.tgz --access public --provenance
        working-directory: packages/canopycms-auth-dev

      - name: Publish canopycms-cdk
        run: |
          pnpm pack
          pnpm dlx npm@11.19.0 publish canopycms-cdk-*.tgz --access public --provenance
        working-directory: packages/canopycms-cdk

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A '*/package.json' package.json
          # [skip ci] is required: app-token pushes DO re-trigger workflows
          # (GITHUB_TOKEN pushes don't), so without it this push would re-run
          # publish.yml and loop forever bumping the version.
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push
          git push --tags

  # Manual dispatch routes here instead: publish the selected branch under the
  # `int` dist-tag, without bumping or committing any version field.
  prerelease:
    name: Prerelease
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/publish-prerelease.yml
    permissions:
      contents: read
      id-token: write
