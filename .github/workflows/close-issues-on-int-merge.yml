name: Close issues on integration merge

# GitHub closes the issues a PR names with a closing keyword ("Closes #12")
# only when the PR merges into the default branch. Nearly every PR here merges
# into an `int-*` branch instead, so this closes them at that merge.
#
# pull_request_target runs this file as it is on the base branch, with a token
# that can write even for a PR from a fork. That is safe here only because
# nothing from the PR is checked out or run: the job reads the event payload
# (the PR body, as data in an environment variable) and calls `gh`. Keep it
# that way -- no actions/checkout, no `${{ }}` of PR text inside `run:`.
on:
  pull_request_target:
    types: [closed]
    branches: ['int-*']

permissions: {}

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the issues the PR body names
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # GitHub's closing keywords, each naming one issue as `#N`,
        # `owner/repo#N` or an issue URL in this repository. Numbers that are
        # pull requests, or already closed, are skipped.
        run: |
          node --input-type=module -e '
            const repo = process.env.REPO.toLowerCase()
            const body = process.env.PR_BODY ?? ""
            const ref = String.raw`(?:([\w.-]+\/[\w.-]+)#|#|https:\/\/github\.com\/([\w.-]+\/[\w.-]+)\/issues\/)(\d+)`
            const rx = new RegExp(String.raw`\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+` + ref, "gi")
            const numbers = new Set()
            for (const m of body.matchAll(rx)) {
              const target = (m[1] ?? m[2] ?? repo).toLowerCase()
              if (target === repo) numbers.add(Number(m[3]))
            }
            console.log([...numbers].join(" "))
          ' > numbers.txt
          for n in $(cat numbers.txt); do
            state=$(gh api "repos/$REPO/issues/$n" --jq 'if .pull_request then "pr" else .state end' || echo missing)
            if [ "$state" != "open" ]; then
              echo "#$n: $state, skipped"
              continue
            fi
            gh issue close "$n" --repo "$REPO" --reason completed \
              --comment "Closed by #$PR_NUMBER, merged into \`$BASE_REF\`."
            echo "#$n: closed"
          done
