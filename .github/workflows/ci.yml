name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API clients
        run: pnpm run generate:client
        working-directory: packages/canopycms

      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --porcelain packages/canopycms/src/api/client.ts packages/canopycms/src/api/__test__/mock-client.ts)" ]; then
            echo "❌ Generated files are out of sync!"
            echo ""
            echo "Run 'pnpm run generate:client' in packages/canopycms and commit the changes."
            echo ""
            echo "Changes detected:"
            git diff packages/canopycms/src/api/client.ts
            git diff packages/canopycms/src/api/__test__/mock-client.ts
            exit 1
          fi
          echo "✅ Generated files are up to date"

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm exec prettier --check .

      - name: TypeScript type checking
        run: pnpm typecheck

      - name: Build
        run: pnpm run build
        working-directory: packages/canopycms

      - name: Run tests
        working-directory: packages/canopycms
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: true
          # Git identity via env (process-scoped) instead of `git config` — an
          # on-disk config once got replicated locally and misattributed commits.
          GIT_AUTHOR_NAME: CI Bot
          GIT_AUTHOR_EMAIL: ci@canopycms.test
          GIT_COMMITTER_NAME: CI Bot
          GIT_COMMITTER_EMAIL: ci@canopycms.test
        run: pnpm test

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/3)
    # Re-enabled 2026-07-24 after the stabilization fix batch (see
    # apps/test-app/e2e/E2E-FAILURE-ANALYSIS.md). Sharded 3-way at the CI
    # level: each shard gets its own runner, server, and workspace, so the
    # shards can't contend (in-process Playwright workers CAN'T work here —
    # all tests share one workspace + server; see playwright.config.ts).
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Git identity via env (process-scoped) instead of `git config` — an
      # on-disk config once got replicated locally and misattributed commits.
      GIT_AUTHOR_NAME: CI Bot
      GIT_AUTHOR_EMAIL: ci@canopycms.test
      GIT_COMMITTER_NAME: CI Bot
      GIT_COMMITTER_EMAIL: ci@canopycms.test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure local main branch exists
        run: git branch main origin/main 2>/dev/null || true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        # No `--` separator: pnpm forwards it literally, and Playwright then
        # reads everything after it as test-file filters ("No tests found").
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  e2e-report:
    name: Merge E2E report
    # Merge per-shard blob reports into one HTML report. Runs even when a
    # shard failed (that's when the report matters most), but not on cancel.
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 14
