name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API clients
        run: pnpm run generate:client
        working-directory: packages/canopycms

      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --porcelain packages/canopycms/src/api/client.ts packages/canopycms/src/api/__test__/mock-client.ts)" ]; then
            echo "❌ Generated files are out of sync!"
            echo ""
            echo "Run 'pnpm run generate:client' in packages/canopycms and commit the changes."
            echo ""
            echo "Changes detected:"
            git diff packages/canopycms/src/api/client.ts
            git diff packages/canopycms/src/api/__test__/mock-client.ts
            exit 1
          fi
          echo "✅ Generated files are up to date"

      - name: Lint (ESLint)
        run: pnpm lint

      # Fails fast on node built-ins reachable from canopycms/client; the e2e
      # production build catches the same class of bug ~3 minutes later.
      - name: Lint client bundle boundary (dependency-cruiser)
        run: pnpm lint:bundle

      - name: Format check (Prettier)
        run: pnpm exec prettier --check .

      - name: TypeScript type checking
        run: pnpm typecheck

      - name: Build
        run: pnpm run build
        working-directory: packages/canopycms

      - name: Run tests
        working-directory: packages/canopycms
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: true
          # Git identity via env (process-scoped) instead of `git config` — an
          # on-disk config once got replicated locally and misattributed commits.
          GIT_AUTHOR_NAME: CI Bot
          GIT_AUTHOR_EMAIL: ci@canopycms.test
          GIT_COMMITTER_NAME: CI Bot
          GIT_COMMITTER_EMAIL: ci@canopycms.test
        run: pnpm test

  dual-build:
    name: Dual-Build Fixture (static + cms)
    # Verifies CanopyCMS's two deploy shapes (README.md "Dual-Build Sites")
    # by actually running `next build` twice against apps/dual-build-fixture
    # -- see dual-build.test.ts for what it asserts. Two Next builds are
    # expensive, so this job only does the real work on PRs that touch
    # something able to break the split (below). It is deliberately NOT
    # gated with a `paths:` filter on the workflow trigger itself: if this
    # job is ever marked "required" in branch protection, a `paths:`-skipped
    # *workflow* run never posts a status for that job name at all, so the PR
    # is stuck on "Expected — Waiting for status to be reported" forever --
    # a well-known GitHub Actions trap. Instead the job always runs (so it
    # always reports a conclusion) and the filter step below only skips the
    # expensive steps inside it, via per-step `if:`, so an irrelevant PR gets
    # a fast "success" rather than a permanently pending required check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter diffs against the PR base/previous push

      - name: Check for dual-build-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'packages/canopycms-next/**'
              - 'packages/canopycms/src/cli/template-files/**'
              - 'packages/canopycms/src/build/**'
              - 'packages/canopycms/src/static/**'
              - 'apps/dual-build-fixture/**'
              - '.github/workflows/ci.yml'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.relevant == 'true'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      # canopycms-next's "./config" export (what apps/dual-build-fixture's
      # next.config.mjs imports) resolves to a pre-bundled dist/config.{cjs,mjs}
      # -- esbuild-bundled because Next's own config loader can't process raw
      # TS -- unlike the rest of the package, which workspace consumers import
      # straight from src/ via transpilePackages. Nothing else in CI builds
      # this package (no app importing canopycms-next/config was `next
      # build`-ed here before this job existed), so it has to happen explicitly.
      - name: Build canopycms-next
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm --filter canopycms-next run build

      # Next.js incremental build cache, same pattern as the e2e job's
      # apps/test-app cache below -- this job runs two full `next build`s
      # per PR (the expensive part the path filter above exists to gate),
      # so keeping them incremental matters more here, not less.
      - name: Cache Next.js build cache
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: apps/dual-build-fixture/.next/cache
          key: nextjs-dual-build-fixture-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-dual-build-fixture-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build and verify both deploy shapes
        if: steps.filter.outputs.relevant == 'true'
        working-directory: apps/dual-build-fixture
        env:
          # Dev-mode content reads at request time (the cms build's `/`) do
          # real git ops against a local workspace -- same identity pattern
          # as the `validate` and `e2e` jobs above.
          GIT_AUTHOR_NAME: CI Bot
          GIT_AUTHOR_EMAIL: ci@canopycms.test
          GIT_COMMITTER_NAME: CI Bot
          GIT_COMMITTER_EMAIL: ci@canopycms.test
        run: pnpm run verify:dual-build

      - name: Skipped (no dual-build-relevant changes)
        if: steps.filter.outputs.relevant != 'true'
        run: echo "No changes under the dual-build-relevant paths -- skipping the two next builds."

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/3)
    # Re-enabled 2026-07-24 after the stabilization fix batch (see
    # apps/test-app/e2e/E2E-FAILURE-ANALYSIS.md). Sharded 3-way at the CI
    # level: each shard gets its own runner, server, and workspace, so the
    # shards can't contend (in-process Playwright workers CAN'T work here —
    # all tests share one workspace + server; see playwright.config.ts).
    # No `needs: validate` — running in parallel with it cuts total PR
    # latency by the whole validate duration and lets e2e-only iteration
    # skip the wait.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Git identity via env (process-scoped) instead of `git config` — an
      # on-disk config once got replicated locally and misattributed commits.
      GIT_AUTHOR_NAME: CI Bot
      GIT_AUTHOR_EMAIL: ci@canopycms.test
      GIT_COMMITTER_NAME: CI Bot
      GIT_COMMITTER_EMAIL: ci@canopycms.test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure local main branch exists
        run: git branch main origin/main 2>/dev/null || true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      # Next.js incremental build cache — makes each shard's `next build`
      # (playwright.config webServer, CI path) largely incremental instead of
      # cold. Keyed to restore the nearest previous cache; Next invalidates
      # stale entries itself.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/test-app/.next/cache
          key: nextjs-test-app-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-test-app-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        # No `--` separator: pnpm forwards it literally, and Playwright then
        # reads everything after it as test-file filters ("No tests found").
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          overwrite: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          overwrite: true

  e2e-report:
    name: Merge E2E report
    # Merge per-shard blob reports into one HTML report. Runs even when a
    # shard failed (that's when the report matters most), but not on cancel.
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 14
          overwrite: true
