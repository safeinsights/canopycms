name: CI

on:
  pull_request:
  push:
    branches: [main]

# Defence in depth. This is NOT currently exploitable -- the repo's
# `default_workflow_permissions` is `read`, verified against live config -- but
# that means this workflow's token scope depends entirely on a repo-level
# setting no one would think to check before changing, while every other
# workflow here (and the generated adopter workflow) scopes its own. It matters
# because `pnpm install` runs untrusted dependency lifecycle scripts alongside
# the credentials `actions/checkout` persists on disk.
permissions:
  contents: read
  # dorny/paths-filter reads PR metadata when it cannot diff from git
  # history alone. Read-only either way -- the property this block buys is
  # that NOTHING here is writable.
  pull-requests: read

jobs:
  validate:
    name: Validate, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API clients
        run: pnpm run generate:client
        working-directory: packages/canopycms

      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --porcelain packages/canopycms/src/api/client.ts packages/canopycms/src/api/__test__/mock-client.ts)" ]; then
            echo "❌ Generated files are out of sync!"
            echo ""
            echo "Run 'pnpm run generate:client' in packages/canopycms and commit the changes."
            echo ""
            echo "Changes detected:"
            git diff packages/canopycms/src/api/client.ts
            git diff packages/canopycms/src/api/__test__/mock-client.ts
            exit 1
          fi
          echo "✅ Generated files are up to date"

      - name: Lint (ESLint)
        run: pnpm lint

      # Fails fast on node built-ins reachable from canopycms/client; the e2e
      # production build catches the same class of bug ~3 minutes later.
      - name: Lint client bundle boundary (dependency-cruiser)
        run: pnpm lint:bundle

      # Backlog hygiene: dead links between task files, index rows still listed
      # open whose file moved to resolved/, and orphans in both directions.
      # Dependency-free and ~instant; also runs in pre-commit via lint-staged.
      - name: Lint future-tasks backlog
        run: pnpm lint:tasks

      - name: Format check (Prettier)
        run: pnpm exec prettier --check .

      - name: TypeScript type checking
        run: pnpm typecheck

      - name: Build
        run: pnpm run build
        working-directory: packages/canopycms

      # Builds every OTHER published package (not the example/test apps —
      # those get their own dedicated build coverage in the dual-build and
      # e2e jobs below). Needed so check:esm below has real dist/ output to
      # resolve for canopycms-next, canopycms-auth-clerk, canopycms-auth-dev
      # and canopycms-cdk, none of which the step above builds.
      - name: Build other published packages
        run: >-
          pnpm --filter canopycms-next --filter canopycms-auth-clerk
          --filter canopycms-auth-dev --filter canopycms-cdk run build

      # Regression guard for the extensionless-relative-import defect (see
      # scripts/add-js-extensions.mjs): actually resolves each published
      # package's entry points under Node's native ESM resolver. Catches the
      # class of bug that shipped silently for four of five packages until a
      # real adopter hit it — `tsc` with moduleResolution:"Bundler" preserves
      # bare relative specifiers, which only Node's resolver (not tsc, not a
      # bundler) rejects.
      - name: Check published packages import under Node ESM
        run: pnpm check:esm

      # Runs at the workspace ROOT (`pnpm -r run test`), deliberately: pinning
      # this to packages/canopycms meant `pnpm test` resolved to that one
      # package's script, so canopycms-cdk, canopycms-next, canopycms-auth-clerk
      # and canopycms-auth-dev had never had their tests run in CI at all. The
      # CDK suite matters most - it is the only automated check on the deploy
      # template (Function-URL-is-AWS_IAM-only, Lambda->EFS egress, ASG update
      # policy, log-group names), several of its cases are regression tests for
      # bugs that already shipped once, and `pnpm typecheck` being recursive is
      # probably why the gap went unnoticed. Root scope also means a newly added
      # package is covered by default instead of needing someone to remember.
      # Every workspace `test` script is vitest (apps/example1 is a no-op echo),
      # so this adds no browser/e2e work - Playwright stays in its own job.
      - name: Run tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: true
          # Git identity via env (process-scoped) instead of `git config` — an
          # on-disk config once got replicated locally and misattributed commits.
          GIT_AUTHOR_NAME: CI Bot
          GIT_AUTHOR_EMAIL: ci@canopycms.test
          GIT_COMMITTER_NAME: CI Bot
          GIT_COMMITTER_EMAIL: ci@canopycms.test
        run: pnpm test

  dual-build:
    name: Dual-Build Fixture (static + cms)
    # Verifies CanopyCMS's two deploy shapes (README.md "Dual-Build Sites")
    # by actually running `next build` twice against apps/dual-build-fixture
    # -- see dual-build.test.ts for what it asserts. Two Next builds are
    # expensive, so this job only does the real work on PRs that touch
    # something able to break the split (below). It is deliberately NOT
    # gated with a `paths:` filter on the workflow trigger itself: if this
    # job is ever marked "required" in branch protection, a `paths:`-skipped
    # *workflow* run never posts a status for that job name at all, so the PR
    # is stuck on "Expected — Waiting for status to be reported" forever --
    # a well-known GitHub Actions trap. Instead the job always runs (so it
    # always reports a conclusion) and the filter step below only skips the
    # expensive steps inside it, via per-step `if:`, so an irrelevant PR gets
    # a fast "success" rather than a permanently pending required check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # paths-filter diffs against the PR base/previous push

      - name: Check for dual-build-relevant changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # Deliberately NOT the whole of packages/canopycms/src/**: the
            # split itself lives in canopycms-next (withCanopy,
            # pageExtensions, route adapters) and the fixture; core-package
            # source changes are covered by lint:bundle (client-entry node
            # builtin reachability) and the unit suite, and gating two Next
            # builds on every core change would make this job run on most
            # PRs. Manifest/lockfile changes DO run it — a dependency
            # resolution change can break a build shape on its own.
            relevant:
              - 'packages/canopycms-next/**'
              - 'packages/canopycms/src/cli/template-files/**'
              - 'packages/canopycms/src/build/**'
              - 'packages/canopycms/src/static/**'
              - 'packages/canopycms/package.json'
              - 'apps/dual-build-fixture/**'
              # The lockfile decides which Next/react/canopycms dep versions
              # the fixture actually builds with -- a resolution change (e.g.
              # a Next bump, the exact class the known-good-version pin in
              # canopycms-next's peerDependencies exists for) can break a
              # build shape without touching any of the paths above.
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.filter.outputs.relevant == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      # The fixture runs in CanopyCMS `mode: 'dev'`, whose request-time content
      # read resolves the active branch from git HEAD. actions/checkout leaves
      # HEAD *detached*, which resolves to the literal name "HEAD" -- a name
      # parseBranchName rejects outright -- so the cms build's `/` 500s at
      # request time while passing locally, where HEAD is on a real branch.
      # Merely creating `main` (as the e2e job does) is not enough: that gives
      # the branch a name but leaves HEAD detached. Pointing `main` AT the
      # checked-out commit and attaching HEAD to it is what makes dev mode
      # resolve, and it also means the branch content is the PR's content --
      # `main` at origin/main would not contain this PR's fixture files at all.
      # Only the cms build needs this; the static build reads content at build
      # time.
      - name: Attach HEAD to a real branch for dev-mode content reads
        if: steps.filter.outputs.relevant == 'true'
        run: git checkout -B main

      # canopycms-next's "./config" export (what apps/dual-build-fixture's
      # next.config.mjs imports) resolves to a pre-bundled dist/config.{cjs,mjs}
      # -- esbuild-bundled because Next's own config loader can't process raw
      # TS -- unlike the rest of the package, which workspace consumers import
      # straight from src/ via transpilePackages. Nothing else in CI builds
      # this package (no app importing canopycms-next/config was `next
      # build`-ed here before this job existed), so it has to happen explicitly.
      - name: Build canopycms-next
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm --filter canopycms-next run build

      # Next.js incremental build cache, same pattern as the e2e job's
      # apps/test-app cache below -- this job runs two full `next build`s
      # per PR (the expensive part the path filter above exists to gate),
      # so keeping them incremental matters more here, not less.
      - name: Cache Next.js build cache
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/dual-build-fixture/.next/cache
          key: nextjs-dual-build-fixture-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-dual-build-fixture-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build and verify both deploy shapes
        if: steps.filter.outputs.relevant == 'true'
        working-directory: apps/dual-build-fixture
        env:
          # Dev-mode content reads at request time (the cms build's `/`) do
          # real git ops against a local workspace -- same identity pattern
          # as the `validate` and `e2e` jobs above.
          GIT_AUTHOR_NAME: CI Bot
          GIT_AUTHOR_EMAIL: ci@canopycms.test
          GIT_COMMITTER_NAME: CI Bot
          GIT_COMMITTER_EMAIL: ci@canopycms.test
        run: pnpm run verify:dual-build

      - name: Skipped (no dual-build-relevant changes)
        if: steps.filter.outputs.relevant != 'true'
        run: echo "No changes under the dual-build-relevant paths -- skipping the two next builds."

  example1-build:
    name: Example1 Build & Content Gate
    # apps/example1 is the reference app most doc snippets and e2e
    # expectations are written against, but until now it was never built in
    # CI at all -- `validate` above only type-checks/lints it, and
    # `dual-build`'s two builds are apps/dual-build-fixture, a different app.
    # See .claude/future-tasks/resolved/example1-next-build-not-in-ci.md.
    #
    # A green `next build` is NOT sufficient evidence by itself: Next happily
    # prerenders the not-found boundary into a route and still calls that a
    # successful build, and a sitemap can silently advertise a stale URL
    # while the exit code stays 0. build-verify.test.ts's own doc comment
    # has the incident that motivated this job. So this job doesn't just run
    # `next build` -- it runs apps/example1's `verify:build` script, which
    # asserts on the prerendered OUTPUT (real home content at "/", "/" and
    # not "/home" in sitemap.xml).
    #
    # This is a separate job from `dual-build` above rather than extra steps
    # in it: that job verifies a structurally different thing (the
    # static-export/CMS deploy-shape split, via a different fixture app that
    # is not `mode: 'dev'` for its static flavor), and folding a third
    # `next build` with an unrelated pass/fail meaning into it would make a
    # red `dual-build` ambiguous about which regression actually fired.
    #
    # Path-gated the same way `dual-build` is above, and for the same
    # reason: the job always RUNS (so it always reports a conclusion --  a
    # `paths:` filter on the trigger itself would leave a "required" check
    # stuck pending on PRs that don't touch these paths), and only the
    # expensive build+verify step is skipped via per-step `if:` when nothing
    # relevant changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter diffs against the PR base/previous push

      - name: Check for example1-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # The app itself, plus the shared code its build actually
            # exercises. This has to cover more than static/ and build/:
            # build-verify.test.ts's own doc comment names the historical
            # incident as a URL-resolution bug (readByUrlPath('/') missing
            # the re-modelled home entry, so Next silently prerendered the
            # not-found boundary at '/' with exit code 0) plus a base-branch
            # resolution hazard specific to this app's dev-mode build-time
            # reads -- neither mechanism lives under static/ or build/, so a
            # regression there used to pass this gate on both the PR AND the
            # push to main. This gate has two halves that go through
            # different code, traced separately.
            #
            # Half 1 -- the page-render assertions (home, plus a non-home
            # route, actually prerendering content instead of the not-found
            # boundary). Traced the dependency chain from context.ts's
            # readByUrlPath down to what it actually calls:
            #   - context.ts (readByUrlPath/read) and url-path-resolver.ts
            #     (URL -> entry candidates -- the literal mechanism that
            #     broke)
            #   - content-reader.ts, the glue read()/readByUrlPath route
            #     through (imports utils/entry-url's isIndexSlug directly)
            #   - branch-workspace.ts, which resolves/provisions the dev-mode
            #     branch workspace this build reads from, and imports both
            #     utils/git's resolveBaseBranch (the base-branch fallback
            #     named above) and operating-mode's strategy selection
            #   - utils/git.ts and operating-mode/** themselves
            #   - utils/entry-url.ts, the index-slug rule url-path-resolver.ts
            #     and static/'s own duplicate-URL guard must keep agreeing on
            #     (see AGENTS.md)
            #   - content-store.ts, whose resolvePath/read content-reader.ts
            #     calls directly for every entry this build serves
            #
            # Half 2 -- the sitemap assertions (advertises '/', never the
            # stale '/home' -- the OTHER historical incident this job exists
            # to catch). These run entirely through listEntries, not
            # readByUrlPath: generateContentSitemap -> collectRoutableEntries
            # -> ctx.listEntries -> content-listing.ts, which is where
            # `urlPath` is actually computed per listed entry.
            # content-listing.ts is a SIBLING of content-store.ts here, not a
            # caller of it -- content-store.ts's own doc comment on
            # `resolveReferences` says the listing primitives "read entry
            # files straight off disk and never touch this store", so having
            # content-store.ts in this filter does nothing for a regression
            # in content-listing.ts. collectStaticPaths and
            # collectRoutableEntries share one internal pass (see AGENTS.md)
            # that also runs three build-time guards over every listed entry
            # before either returns; two of those reach outside static/:
            #   - assertRoutableSlugs, which runs paths/validation.ts's
            #     parseSlug over every entry's slug (paths/** also covers
            #     content-listing.ts's own validateAndNormalizePath import)
            #   - assertBuildEntriesValid, which calls
            #     validation/entry-validator.ts's validateEntryData /
            #     findUnknownKeys (which in turn import sibling files under
            #     validation/**, e.g. field-traversal.ts)
            #   - assertNoDuplicateUrlPaths, already covered -- it lives in
            #     static/index.ts itself
            # content-listing.ts also parses each filename into
            # {type, slug, id} via utils/typed-filename.ts's
            # parseTypedFilename before computeEntryUrl (already covered via
            # utils/entry-url.ts) ever runs, so that file joins the list too.
            # Checked and deliberately NOT added: content-tree.ts. Its
            # buildContentTree is a different primitive from listEntries and
            # nothing in this app's actual build calls it (the only hit
            # anywhere under apps/example1 is a generic-signature mention in
            # a doc comment, not a call site) -- content-tree.ts backs the
            # editor's tree view, not static generation.
            #
            # Deliberately NOT adding url-collision.ts: that guard runs at
            # the content-WRITE boundary (create/rename via
            # content-store.ts's assertUrlPathAvailable), which a `next
            # build` never exercises -- the build-time duplicate-URL check
            # this job actually relies on is static/'s assertNoDuplicateUrlPaths,
            # already covered above. Everything else under
            # packages/canopycms/src/** stays out to keep this job rare
            # (content-listing.ts's own generic utility imports --
            # content-id-index.ts, utils/body-field.ts, utils/format.ts --
            # are left out for the same reason content-store.ts's identical
            # imports of those same files were never added here); it is
            # covered by lint:bundle and the unit suite. Manifest/lockfile
            # changes DO run it -- a dependency resolution change can break
            # this build shape on its own.
            relevant:
              - 'apps/example1/**'
              - 'packages/canopycms-next/**'
              - 'packages/canopycms/src/static/**'
              - 'packages/canopycms/src/build/**'
              - 'packages/canopycms/src/context.ts'
              - 'packages/canopycms/src/url-path-resolver.ts'
              - 'packages/canopycms/src/content-reader.ts'
              - 'packages/canopycms/src/content-listing.ts'
              - 'packages/canopycms/src/branch-workspace.ts'
              - 'packages/canopycms/src/content-store.ts'
              - 'packages/canopycms/src/utils/git.ts'
              - 'packages/canopycms/src/utils/entry-url.ts'
              - 'packages/canopycms/src/utils/typed-filename.ts'
              - 'packages/canopycms/src/paths/**'
              - 'packages/canopycms/src/validation/**'
              - 'packages/canopycms/src/operating-mode/**'
              - 'packages/canopycms/package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.relevant == 'true'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      # apps/example1 is always CanopyCMS `mode: 'dev'` (see its
      # canopycms.config.ts) -- there is no separate static-export flavor
      # here, unlike apps/dual-build-fixture. Dev mode's base-branch
      # resolution (`resolveBaseBranch` / `detectHeadBranch` in canopycms's
      # utils/git.ts) falls back to the literal name 'main' whenever HEAD is
      # detached, which is exactly what actions/checkout leaves it as. That
      # is true for this BUILD-TIME read too, not only a request-time one --
      # verified empirically while building this job: without this step, a
      # detached HEAD alongside any pre-existing local `main` makes the
      # build silently read `main`'s (older/different) content instead of
      # the checked-out commit's, which reproduces BOTH halves of the
      # historical bug this job exists to catch (empty home page, stale
      # "/home" in the sitemap) regardless of whether this PR's own code and
      # content are fine. Pointing `main` at the checked-out commit and
      # attaching HEAD to it (not merely creating it -- see
      # apps/dual-build-fixture's identical step above) is what makes dev
      # mode read this commit's actual content.
      - name: Attach HEAD to a real branch for dev-mode content reads
        if: steps.filter.outputs.relevant == 'true'
        run: git checkout -B main

      # canopycms-next's "./config" export (what apps/example1's
      # next.config.mjs imports) resolves to a pre-bundled
      # dist/config.{cjs,mjs} -- esbuild-bundled because Next's own config
      # loader can't process raw TS -- unlike the rest of the package, which
      # workspace consumers import straight from src/ via transpilePackages.
      # Nothing else in this job builds this package.
      - name: Build canopycms-next
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm --filter canopycms-next run build

      # Next.js incremental build cache, same pattern as the dual-build and
      # e2e jobs' own caches.
      - name: Cache Next.js build cache
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: apps/example1/.next/cache
          key: nextjs-example1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-example1-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build apps/example1 and verify its output
        if: steps.filter.outputs.relevant == 'true'
        working-directory: apps/example1
        run: pnpm run verify:build

      - name: Skipped (no example1-relevant changes)
        if: steps.filter.outputs.relevant != 'true'
        run: echo "No changes under example1-relevant paths -- skipping the next build + output assertions."

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/4)
    # Re-enabled 2026-07-24 after the stabilization fix batch (see
    # apps/test-app/e2e/E2E-FAILURE-ANALYSIS.md). Sharded 4-way at the CI
    # level: each shard gets its own runner, server, and workspace, so the
    # shards can't contend (in-process Playwright workers CAN'T work here —
    # all tests share one workspace + server; see playwright.config.ts, and
    # DEVELOPING.md "End-to-End Tests" for what contention looks like when
    # someone runs the suite multi-worker locally).
    # No `needs: validate` — running in parallel with it cuts total PR
    # latency by the whole validate duration and lets e2e-only iteration
    # skip the wait.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Git identity via env (process-scoped) instead of `git config` — an
      # on-disk config once got replicated locally and misattributed commits.
      GIT_AUTHOR_NAME: CI Bot
      GIT_AUTHOR_EMAIL: ci@canopycms.test
      GIT_COMMITTER_NAME: CI Bot
      GIT_COMMITTER_EMAIL: ci@canopycms.test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure local main branch exists
        run: git branch main origin/main 2>/dev/null || true

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      # Next.js incremental build cache — makes each shard's `next build`
      # (playwright.config webServer, CI path) largely incremental instead of
      # cold. Keyed to restore the nearest previous cache; Next invalidates
      # stale entries itself.
      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/test-app/.next/cache
          key: nextjs-test-app-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-test-app-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        # No `--` separator: pnpm forwards it literally, and Playwright then
        # reads everything after it as test-file filters ("No tests found").
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          overwrite: true

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          overwrite: true

  e2e-report:
    name: Merge E2E report
    # Merge per-shard blob reports into one HTML report. Runs even when a
    # shard failed (that's when the report matters most), but not on cancel.
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 14
          overwrite: true
